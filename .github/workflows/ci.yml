name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:dind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@latest
      - name: Unit tests
        run: make test-unit
      - name: Integration tests
        run: make test-integration
      - name: E2E tests
        run: make test-e2e
      - name: Build
        run: make build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm template govnohub ./deploy/helm/govnohub -f ./deploy/helm/govnohub/values-k3s.yaml > /dev/null
