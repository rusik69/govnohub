name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@latest
      - name: Generate templates
        run: make generate
      - name: Unit tests
        run: make test-unit
      - name: Integration tests
        run: make test-integration
      - name: E2E tests
        run: make test-e2e
      - name: Deploy E2E tests
        run: make test-deploy-e2e
      - name: Build
        run: make build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm template govnohub ./deploy/helm/govnohub -f ./deploy/helm/govnohub/values-k3s.yaml > /dev/null
