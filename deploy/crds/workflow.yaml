apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workflows.govnohub.io
spec:
  group: govnohub.io
  names:
    kind: Workflow
    plural: workflows
    singular: workflow
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                repo:
                  type: string
                path:
                  type: string
                content:
                  type: string
            status:
              type: object
              properties:
                active:
                  type: boolean
      subresources:
        status: {}
