# kind + podman local deployment overrides
image:
  repository: localhost/govnohub
  tag: latest
  pullPolicy: Never

ingress:
  enabled: true
  className: nginx
  host: govnohub.local
  gitHost: git.govnohub.local

postgresql:
  storage: 2Gi

opensearch:
  storage: 2Gi

git:
  storage: 2Gi
  accessMode: ReadWriteOnce

artifacts:
  storage: 2Gi
  accessMode: ReadWriteOnce

runner:
  namespace: govnohub-runners
  image: alpine:3.24

jwtSecret: kind-dev-secret

bootstrapAdmin:
  username: admin
  email: admin@govnohub.local
  password: admin

allowPublicRegistration: false
