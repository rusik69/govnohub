apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "govnohub.fullname" . }}-git
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: {{ .Values.git.storage }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "govnohub.fullname" . }}-artifacts
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: {{ .Values.artifacts.storage }}
