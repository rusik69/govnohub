{{- if .Values.opensearch.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "govnohub.fullname" . }}-opensearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "govnohub.fullname" . }}-opensearch
  template:
    metadata:
      labels:
        app: {{ include "govnohub.fullname" . }}-opensearch
    spec:
      containers:
        - name: opensearch
          image: {{ .Values.opensearch.image }}
          env:
            - name: discovery.type
              value: single-node
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          ports:
            - containerPort: 9200
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "govnohub.fullname" . }}-opensearch
spec:
  selector:
    app: {{ include "govnohub.fullname" . }}-opensearch
  ports:
    - port: 9200
{{- end }}
