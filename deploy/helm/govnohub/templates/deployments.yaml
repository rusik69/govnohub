{{- $root := . }}
{{- range $name, $cfg := dict "api-server" .Values.services.apiServer "git-server" .Values.services.gitServer "webhook-service" .Values.services.webhookService "actions-controller" .Values.services.actionsController "search-indexer" .Values.services.searchIndexer }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "govnohub.fullname" $root }}-{{ $name }}
  labels:
    {{- include "govnohub.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      app: {{ include "govnohub.fullname" $root }}-{{ $name }}
  template:
    metadata:
      labels:
        app: {{ include "govnohub.fullname" $root }}-{{ $name }}
    spec:
      serviceAccountName: {{ include "govnohub.fullname" $root }}-{{ $name }}
      containers:
        - name: {{ $name }}
          image: "{{ $root.Values.image.repository }}/{{ $name }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          env:
            - name: DATABASE_URL
              value: {{ include "govnohub.databaseURL" $root | quote }}
            - name: JWT_SECRET
              value: {{ $root.Values.jwtSecret | quote }}
            - name: GIT_ROOT
              value: /data/git
            - name: ARTIFACT_ROOT
              value: /data/artifacts
            - name: OPENSEARCH_URL
              value: http://{{ include "govnohub.fullname" $root }}-opensearch:9200
            - name: RUNNER_NAMESPACE
              value: {{ $root.Values.runner.namespace | quote }}
            - name: RUNNER_IMAGE
              value: {{ $root.Values.runner.image | quote }}
            - name: HTTP_ADDR
              value: ":8080"
            - name: GIT_HTTP_ADDR
              value: ":8081"
            {{- if eq $name "git-server" }}
            - name: GIT_SSH_ADDR
              value: ":{{ $root.Values.services.gitServer.sshPort }}"
            - name: GIT_SSH_HOST_KEY
              value: /data/git/.ssh_host_key
            {{- end }}
            - name: WEBHOOK_HTTP_ADDR
              value: ":8082"
            {{- if eq $name "api-server" }}
            - name: BOOTSTRAP_ADMIN_USERNAME
              value: {{ $root.Values.bootstrapAdmin.username | quote }}
            - name: BOOTSTRAP_ADMIN_EMAIL
              value: {{ $root.Values.bootstrapAdmin.email | quote }}
            - name: BOOTSTRAP_ADMIN_PASSWORD
              value: {{ $root.Values.bootstrapAdmin.password | quote }}
            - name: ALLOW_PUBLIC_REGISTRATION
              value: {{ $root.Values.allowPublicRegistration | quote }}
            - name: AI_REVIEW_ENABLED
              value: {{ $root.Values.aiReview.enabled | quote }}
            - name: AI_REVIEW_MODEL
              value: {{ $root.Values.aiReview.model | quote }}
            - name: AI_REVIEW_BASE_URL
              value: {{ $root.Values.aiReview.baseURL | quote }}
            - name: AI_REVIEW_AUTO
              value: {{ $root.Values.aiReview.auto | quote }}
            {{- if $root.Values.aiReview.apiKey }}
            - name: OPENCODE_API_KEY
              value: {{ $root.Values.aiReview.apiKey | quote }}
            {{- end }}
            {{- end }}
          ports:
            - containerPort: 8080
            - containerPort: 8081
            {{- if eq $name "git-server" }}
            - containerPort: {{ $root.Values.services.gitServer.sshPort }}
              {{- if $cfg.hostPort }}
              hostPort: {{ $cfg.hostPort }}
              {{- end }}
            {{- end }}
            - containerPort: 8082
          volumeMounts:
            - name: git-data
              mountPath: /data/git
            - name: artifacts
              mountPath: /data/artifacts
      volumes:
        - name: git-data
          persistentVolumeClaim:
            claimName: {{ include "govnohub.fullname" $root }}-git
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ include "govnohub.fullname" $root }}-artifacts
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: api-server
spec:
  selector:
    app: {{ include "govnohub.fullname" . }}-api-server
  ports:
    - port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: git-server
spec:
  selector:
    app: {{ include "govnohub.fullname" . }}-git-server
  ports:
    - name: http
      port: 8081
    - name: ssh
      port: {{ .Values.services.gitServer.sshPort }}
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-service
spec:
  selector:
    app: {{ include "govnohub.fullname" . }}-webhook-service
  ports:
    - port: 8082
